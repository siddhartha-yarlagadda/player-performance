<div class="mx-4">
    <div class="text-xl font-bold mb-4">
        Compare Player Stats
    </div>
    <div>
        <label for="player1Select">Select Player 1:</label>
        <select
            class="ml-2 border border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            id="player1Select" (change)="handlePlayerSelect($event, true)">
            <option value="">-- Select Player --</option>
            <option *ngFor="let player of players; let i = index" [value]="i">
                {{ player.Name }}
            </option>
        </select>
    </div>
    <div>
        <label for="player2Select">Select Player 2:</label>
        <select
            class="ml-2 border border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            id="player2Select" (change)="handlePlayerSelect($event, false)">
            <option value="">-- Select Player --</option>
            <option *ngFor="let player of players; let i = index" [value]="i">
                {{ player.Name }}
            </option>
        </select>
    </div>

    <div class="mt-4">
        <table *ngIf="player1 && player2" class="table-auto w-full border border-gray-300 rounded-xl">
            <thead>
                <tr>
                    <th class="border border-gray-300">Statistic</th>
                    <th class="border border-gray-300">{{ player1.Name }}</th>
                    <th class="border border-gray-300">{{ player2.Name }}</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let stat of stats">
                    <td class="border border-gray-300">{{ stat }}</td>
                    <td class="border border-gray-300">{{ player1[stat]! }}</td>
                    <td class="border border-gray-300">{{ player2[stat]! }}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
